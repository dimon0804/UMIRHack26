map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /__cipherline_health {
        default_type text/plain;
        charset utf-8;
        return 200 "cipherline-container-ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS: резолвим backend при запросе, а не при старте nginx (иначе контейнер падает)
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api http://gateway:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Иначе Bearer не доходит до gateway → progress-service отвечает 401 на /cipherline/state и /leaderboard/me
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400s;
    }
}
