server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Проверка: откройте в браузере /__cipherline_health — должен быть текст cipherline-container-ok
    location = /__cipherline_health {
        default_type text/plain;
        charset utf-8;
        return 200 "cipherline-container-ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
