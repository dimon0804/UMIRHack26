services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberapp_secret_change_me}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberapp} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  adminer:
    image: adminer:5.4.2-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      # Встроенные темы: rmsoft_blue-dark (синяя тёмная), dracula, rmsoft_blue, nette — см. https://github.com/vrana/adminer/tree/master/designs
      ADMINER_DESIGN: ${ADMINER_DESIGN:-rmsoft_blue-dark}
    ports:
      - "${ADMINER_PORT:-5050}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberapp}:${POSTGRES_PASSWORD:-cyberapp_secret_change_me}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal

  simulation-service:
    build:
      context: ./backend/simulation-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      - internal

  progress-service:
    build:
      context: ./backend/progress-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      - internal

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      SIMULATION_SERVICE_URL: http://simulation-service:8000
      PROGRESS_SERVICE_URL: http://progress-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - auth-service
      - simulation-service
      - progress-service
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
