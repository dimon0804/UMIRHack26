services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberapp_secret_change_me}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberapp} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  adminer:
    image: adminer:5.4.2-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      # Встроенные темы: rmsoft_blue-dark (синяя тёмная), dracula, rmsoft_blue, nette — см. https://github.com/vrana/adminer/tree/master/designs
      ADMINER_DESIGN: ${ADMINER_DESIGN:-rmsoft_blue-dark}
    ports:
      - "${ADMINER_PORT:-5050}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberapp}:${POSTGRES_PASSWORD:-cyberapp_secret_change_me}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal

  simulation-service:
    build:
      context: ./backend/simulation-service
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      PROGRESS_SERVICE_URL: http://progress-service:8000
      SIMULATION_LLM_SCENARIOS: ${SIMULATION_LLM_SCENARIOS:-true}
    depends_on:
      ai-service:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal

  # Mistral: как в rnd-hack2026 ai-service (LLM_MODE, MISTRAL_* из .env в корне репозитория)
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    environment:
      LLM_MODE: ${LLM_MODE:-mistral_sdk}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - internal

  progress-service:
    build:
      context: ./backend/progress-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberapp}:${POSTGRES_PASSWORD:-cyberapp_secret_change_me}@postgres:5432/progress_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - internal

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      SIMULATION_SERVICE_URL: http://simulation-service:8000
      AI_SERVICE_URL: http://ai-service:8000
      PROGRESS_SERVICE_URL: http://progress-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      auth-service:
        condition: service_started
      progress-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      simulation-service:
        condition: service_started
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_USE_GATEWAY: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - gateway
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
