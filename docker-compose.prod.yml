# Продакшен-оверрайд: в основном CORS для gateway.
#
# Важно: не публикуем frontend на :80 здесь — иначе конфликт с Caddy (ENABLE_TLS=1), т.к. оба требуют хост :80.
# Без TLS: UI на порту FRONTEND_PORT из docker-compose.yml (по умолчанию 3000).
# С TLS: только Caddy слушает 80/443 → frontend только во внутренней сети.
#
# Linux / macOS:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# Windows PowerShell:
#   $env:COMPOSE_FILE = "docker-compose.yml;docker-compose.prod.yml"

services:
  gateway:
    environment:
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-https://cipherline.clv-digital.tech}
